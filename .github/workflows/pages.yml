# Składanie, testy i publikacja SURGITOME na GitHub Pages przy każdej zmianie w gałęzi main, a także codziennie
# (odświeżenie danych panelu autora: piotrspychalski.pl/surgitome/admin/, kod w admin/)
name: SURGITOME — build, testy, publikacja
on:
  push: { branches: [main] }
  schedule: [ { cron: '17 4 * * *' } ]   # codziennie ok. 5:17 czasu polskiego zimą (6:17 latem)
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node build.js && cp dist/surgitome.html dist/index.html
      - name: Testy szybkie (tłumaczenia, kolizje, interfejs, wyszukiwarka, ulubione, TK, informacja startowa, samouczek, badania, wątroba, statystyki zabiegów, cytowanie, kod QR na telefonie, krezka lewostronna, piśmiennictwo, jelito cienkie z krezką, grupy węzłów, górne piętro, kontekst kadrów, APR i przejście z wyboru zakresu, slajd „Dostęp”)
        run: |
          node tests/i18n.js
          node tests/kolizje_animacji.js | tail -1 | grep -q ': 0' 
          CORE=$(pwd)/tests/core_guz.js node tests/kolizje_animacji.js | tail -1 | grep -q ': 0'
          node tests/audyt_zoom.js | tail -3
          for t in tests/ui_18.js tests/ui_19.js tests/ui_26.js tests/ui_27.js tests/ui_28.js tests/ui_29.js tests/ui_30.js tests/ui_31.js tests/ui_32.js tests/ui_33.js tests/ui_34.js tests/ui_35.js tests/ui_36.js tests/ui_37.js tests/ui_38.js tests/ui_39.js tests/ui_40.js tests/ui_41.js tests/ui_42.js tests/ui_43.js tests/ui_44.js tests/ui_45.js tests/ui_46.js tests/ui_47.js tests/ui_48.js tests/ui_49.js tests/ui_50.js tests/ui_51.js tests/ui_52.js tests/ui_53.js tests/ui_54.js tests/ui_55.js tests/ui_56.js tests/ui_57.js tests/ui_59.js tests/ui_60.js tests/ui_62.js ; do node "$t" | tail -1 | grep -q 'errors \[\]' || { echo "BŁĄD: $t"; exit 1; }; done
      - name: Panel autora — testy i dane z GoatCountera zaszyfrowane hasłem (dist/admin; bez sekretów strona publikuje się bez panelu)
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          PANEL_HASLO: ${{ secrets.PANEL_HASLO }}
        run: |
          node admin/tests/test_szyfr.mjs
          node admin/tests/test_study.mjs
          if [ -n "$GOATCOUNTER_TOKEN" ] && [ -n "$PANEL_HASLO" ]; then
            node admin/zbierz.mjs --out dist/admin || { rm -rf dist/admin; echo "::warning::Panel autora: nie udało się pobrać danych — SURGITOME publikowany bez panelu"; }
          else
            echo "::notice::Panel autora: brak sekretów GOATCOUNTER_TOKEN / PANEL_HASLO — pomijam panel"
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
